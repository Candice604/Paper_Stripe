<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>纸带 · 进阶关卡</title>
  <link rel="stylesheet" href="./advanced.css">
</head>
<body>
  <header class="level-hud">
    <a id="home-link" class="home-link">纸带 Paper Stripe</a>
    <div><span id="level-no">关卡 03</span><strong id="level-title"></strong><small>拖动可 3D 旋转 · ← / → 沿虚线剪开</small></div>
    <p><b>剪开前</b><span id="before-fact"></span></p>
  </header>
  <canvas id="stage" tabindex="0" aria-label="可旋转并用左右方向键剪开的三维纸带"></canvas>
  <section class="result-panel" aria-live="polite">
    <p class="result-label">剪切结果</p>
    <h1 id="result-title"></h1>
    <p class="result-copy" id="result-copy"></p>
    <div class="result-facts" id="result-facts"></div>
    <button id="restart" type="button">再剪一次 <kbd>R</kbd></button>
  </section>
  <nav class="level-nav" aria-label="关卡导航">
    <a id="prev-level" aria-label="上一关">⬅️</a>
    <a id="next-level" aria-label="下一关">➡️</a>
  </nav>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="./advanced.js"></script>
</body>
</html>
